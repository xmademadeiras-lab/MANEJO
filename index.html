<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#022c22" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>ETW CONTROLE DE AUTEX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Global variable to capture beforeinstallprompt before React loads (prevents PWA install race condition)
      window.deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        console.log("PWA beforeinstallprompt captured early in index.html!");
        // Dispatch custom event to notify React if it is already loaded
        window.dispatchEvent(new CustomEvent("pwaPromptAvailable", { detail: e }));
      });

      if ("serviceWorker" in navigator) {
        function registerSW() {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => {
              console.log("Service Worker registered!", reg.scope);
            })
            .catch((err) => {
              console.log("Service Worker registration failed:", err);
            });
        }
        if (document.readyState === "complete" || document.readyState === "interactive") {
          registerSW();
        } else {
          window.addEventListener("load", registerSW);
        }
      }
    </script>
  </body>
</html>
